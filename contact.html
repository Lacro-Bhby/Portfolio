<main class="page">

    <p class="small-title">📩 GET IN TOUCH</p>

    <h1>Contact Me</h1>

    <p class="description">
        Have a project or opportunity? Feel free to send me a message.
    </p>

    <form action="https://formspree.io/f/mppwalez" method="POST">

    <label for="name">Name</label>
    <input
        type="text"
        id="name"
        name="name"
        placeholder="Your name"
        required
    >

    <label for="email">Email</label>
    <input
        type="email"
        id="email"
        name="email"
        placeholder="your@email.com"
        required
    >

    <label for="message">Message</label>
    <textarea
        id="message"
        name="message"
        placeholder="Write your message..."
        required
    ></textarea>

    <button type="submit">
        Send Message
    </button>

</form>

</main>

<footer>
    <p>© 2026 My Portfolio</p>
</footer>

<script src="script.js"></script>
